# Local development only: Postgres (stands in for Neon) and Mailpit (catches magic-link emails).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edu
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - edu-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d edu']
      interval: 2s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

volumes:
  edu-db:
